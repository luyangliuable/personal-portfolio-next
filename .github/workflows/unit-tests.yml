name: Unit Tests

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Run unit tests with per-file coverage gates
              run: npm run test:coverage:ci

            - name: Run lint
              run: npm run lint

            - name: Run production build
              run: npm run build
              env:
                  MONGODB_URI: mongodb://127.0.0.1:27017/test
