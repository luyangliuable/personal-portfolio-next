name: SonarCloud Analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017

      - name: Run lint
        run: npm run lint

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=luyangliuable_personal-portfolio-next
            -Dsonar.organization=luyangliuable
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src,app,pages,components,lib
            -Dsonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.config.js,**/*.config.ts,**/dist/**,**/build/**,**/.next/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Check Quality Gate and Tech Debt
        run: |
          echo "Quality Gate Status: MUST PASS before merge"
          echo "SonarCloud Dashboard: https://sonarcloud.io/project/overview?id=luyangliuable_personal-portfolio-next"
          echo ""
          echo "Fetching current technical debts..."

          # Fetch all open issues from SonarCloud
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=luyangliuable_personal-portfolio-next&statuses=OPEN,CONFIRMED,REOPENED&types=CODE_SMELL,BUG,VULNERABILITY&ps=500" \
            > sonar_issues.json

          # Display summary
          echo ""
          echo "=== CURRENT TECHNICAL DEBTS ==="
          echo "Total Issues: $(jq '.total' sonar_issues.json)"
          echo ""
          echo "Issues by Type:"
          echo "- Code Smells: $(jq '[.issues[] | select(.type=="CODE_SMELL")] | length' sonar_issues.json)"
          echo "- Bugs: $(jq '[.issues[] | select(.type=="BUG")] | length' sonar_issues.json)"
          echo "- Vulnerabilities: $(jq '[.issues[] | select(.type=="VULNERABILITY")] | length' sonar_issues.json)"
          echo ""
          echo "Issues by Severity:"
          echo "- Blocker: $(jq '[.issues[] | select(.severity=="BLOCKER")] | length' sonar_issues.json)"
          echo "- Critical: $(jq '[.issues[] | select(.severity=="CRITICAL")] | length' sonar_issues.json)"
          echo "- Major: $(jq '[.issues[] | select(.severity=="MAJOR")] | length' sonar_issues.json)"
          echo "- Minor: $(jq '[.issues[] | select(.severity=="MINOR")] | length' sonar_issues.json)"
          echo ""
          echo "ALL ISSUES MUST BE RESOLVED BEFORE MERGING TO MAIN"

          # Fail if there are blocker or critical issues
          BLOCKER_COUNT=$(jq '[.issues[] | select(.severity=="BLOCKER")] | length' sonar_issues.json)
          CRITICAL_COUNT=$(jq '[.issues[] | select(.severity=="CRITICAL")] | length' sonar_issues.json)

          if [ "$BLOCKER_COUNT" -gt 0 ] || [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo ""
            echo "ERROR: Found $BLOCKER_COUNT blocker and $CRITICAL_COUNT critical issues"
            echo "These MUST be fixed before merging"
            exit 1
          fi
